<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#F5F0E6"/>
  <text x="50" y="58" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#2f3b2f">Role-Based Navigation</text>
  <text x="50" y="92" font-family="Arial, sans-serif" font-size="18" fill="#5b6659">La navegación cambia según el tipo de usuario para evitar opciones innecesarias.</text>

  <g transform="translate(70 145)">
    <rect width="470" height="430" rx="20" fill="#ffffff" stroke="#A3794F" stroke-width="4"/>
    <rect width="470" height="70" rx="20" fill="#925930"/>
    <text x="30" y="44" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">Ganadero</text>
    <g font-family="Arial, sans-serif" font-size="20" fill="#2f3b2f">
      <rect x="35" y="105" width="400" height="42" rx="10" fill="#F5F0E6"/><text x="62" y="133">Dashboard</text>
      <rect x="35" y="160" width="400" height="42" rx="10" fill="#F5F0E6"/><text x="62" y="188">Fincas y animales</text>
      <rect x="35" y="215" width="400" height="42" rx="10" fill="#F5F0E6"/><text x="62" y="243">Sanidad y actividades</text>
      <rect x="35" y="270" width="400" height="42" rx="10" fill="#F5F0E6"/><text x="62" y="298">Finanzas</text>
      <rect x="35" y="325" width="400" height="42" rx="10" fill="#F5F0E6"/><text x="62" y="353">IoT y planes</text>
    </g>
  </g>

  <g transform="translate(660 145)">
    <rect width="470" height="430" rx="20" fill="#ffffff" stroke="#79B267" stroke-width="4"/>
    <rect width="470" height="70" rx="20" fill="#79B267"/>
    <text x="30" y="44" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">Veterinario</text>
    <g font-family="Arial, sans-serif" font-size="20" fill="#2f3b2f">
      <rect x="35" y="105" width="400" height="42" rx="10" fill="#F5F0E6"/><text x="62" y="133">Dashboard profesional</text>
      <rect x="35" y="160" width="400" height="42" rx="10" fill="#F5F0E6"/><text x="62" y="188">Clientes y pacientes</text>
      <rect x="35" y="215" width="400" height="42" rx="10" fill="#F5F0E6"/><text x="62" y="243">Sanidad y seguimientos</text>
      <rect x="35" y="270" width="400" height="42" rx="10" fill="#F5F0E6"/><text x="62" y="298">Analíticas</text>
      <rect x="35" y="325" width="400" height="42" rx="10" fill="#F5F0E6"/><text x="62" y="353">IoT y planes</text>
    </g>
  </g>

  <text x="180" y="660" font-family="Arial, sans-serif" font-size="20" fill="#5b6659">Cada rol visualiza solo las secciones que apoyan sus tareas principales dentro de AniTec.</text>
</svg>
