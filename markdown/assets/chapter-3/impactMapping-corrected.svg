<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1600" viewBox="0 0 1400 1600">
  <rect width="1400" height="1600" fill="#343941"/>
  <rect x="0" y="0" width="1400" height="70" fill="#2b3037"/>
  <text x="28" y="43" font-family="Arial, sans-serif" font-size="26" fill="#f3f5f7">IMPACT MAP: AniTec</text>

  <g font-family="Arial, sans-serif" font-size="16" fill="#dfe4ea">
    <rect x="0" y="70" width="270" height="52" fill="#2f343c"/>
    <rect x="270" y="70" width="260" height="52" fill="#2f343c"/>
    <rect x="530" y="70" width="280" height="52" fill="#2f343c"/>
    <rect x="810" y="70" width="300" height="52" fill="#2f343c"/>
    <rect x="1110" y="70" width="290" height="52" fill="#2f343c"/>
    <text x="28" y="102">BUSINESS GOALS</text>
    <text x="300" y="102">PERSONAS</text>
    <text x="562" y="102">IMPACTS</text>
    <text x="848" y="102">DELIVERABLES</text>
    <text x="1150" y="102">USER STORIES</text>
  </g>

  <g stroke="#22272f" stroke-width="2" stroke-dasharray="7 10">
    <line x1="270" y1="122" x2="270" y2="1540"/>
    <line x1="530" y1="122" x2="530" y2="1540"/>
    <line x1="810" y1="122" x2="810" y2="1540"/>
    <line x1="1110" y1="122" x2="1110" y2="1540"/>
  </g>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#111820" flood-opacity="0.35"/>
    </filter>
    <style>
      .card { fill: #f7f7f4; filter: url(#shadow); }
      .small { font: 17px Arial, sans-serif; fill: #4b5159; }
      .body { font: 19px Arial, sans-serif; fill: #3b4149; }
      .title { font: 21px Arial, sans-serif; font-weight: 700; fill: #30353c; }
      .label { font: 15px Arial, sans-serif; fill: #626a73; }
      .avatarText { font: 18px Arial, sans-serif; fill: #f3f5f7; text-anchor: middle; }
      .id { font: 16px Arial, sans-serif; font-weight: 700; fill: #1f7a5f; }
    </style>
  </defs>

  <!-- Business goals -->
  <rect class="card" x="35" y="510" width="205" height="145" rx="4"/>
  <text class="body" x="58" y="550">
    <tspan x="58" dy="0">Incrementar en</tspan>
    <tspan x="58" dy="27">40% el registro</tspan>
    <tspan x="58" dy="27">digital de datos</tspan>
    <tspan x="58" dy="27">ganaderos y sanitarios</tspan>
    <tspan x="58" dy="27">en 6 meses.</tspan>
  </text>

  <rect class="card" x="35" y="700" width="205" height="145" rx="4"/>
  <text class="body" x="58" y="740">
    <tspan x="58" dy="0">Reducir en 30%</tspan>
    <tspan x="58" dy="27">los olvidos de</tspan>
    <tspan x="58" dy="27">controles sanitarios</tspan>
    <tspan x="58" dy="27">en un periodo de</tspan>
    <tspan x="58" dy="27">6 meses.</tspan>
  </text>

  <rect class="card" x="35" y="890" width="205" height="145" rx="4"/>
  <text class="body" x="58" y="930">
    <tspan x="58" dy="0">Incrementar en</tspan>
    <tspan x="58" dy="27">35% el uso de</tspan>
    <tspan x="58" dy="27">reportes y dashboards</tspan>
    <tspan x="58" dy="27">por usuarios en</tspan>
    <tspan x="58" dy="27">6 meses.</tspan>
  </text>

  <!-- Personas -->
  <circle cx="400" cy="440" r="58" fill="#f0c15c" stroke="#f7f7f4" stroke-width="5"/>
  <text class="avatarText" x="400" y="432">JR</text>
  <text class="avatarText" x="400" y="457">Ganadero</text>
  <text class="small" x="335" y="530">Jorge Luis Rivas</text>

  <circle cx="400" cy="1070" r="58" fill="#40b9c6" stroke="#f7f7f4" stroke-width="5"/>
  <text class="avatarText" x="400" y="1062">VM</text>
  <text class="avatarText" x="400" y="1087">Veterinaria</text>
  <text class="small" x="328" y="1160">Valeria Mendoza</text>

  <!-- Impact cards -->
  <rect class="card" x="575" y="245" width="210" height="105" rx="4"/>
  <text class="body" x="600" y="285">
    <tspan x="600" dy="0">Registrar datos</tspan>
    <tspan x="600" dy="28">del hato con</tspan>
    <tspan x="600" dy="28">mayor orden.</tspan>
  </text>

  <rect class="card" x="575" y="500" width="210" height="105" rx="4"/>
  <text class="body" x="600" y="540">
    <tspan x="600" dy="0">Reducir olvidos</tspan>
    <tspan x="600" dy="28">en controles</tspan>
    <tspan x="600" dy="28">sanitarios.</tspan>
  </text>

  <rect class="card" x="575" y="755" width="210" height="105" rx="4"/>
  <text class="body" x="600" y="795">
    <tspan x="600" dy="0">Controlar ingresos</tspan>
    <tspan x="600" dy="28">y egresos de la</tspan>
    <tspan x="600" dy="28">operacion.</tspan>
  </text>

  <rect class="card" x="575" y="1005" width="210" height="105" rx="4"/>
  <text class="body" x="600" y="1045">
    <tspan x="600" dy="0">Consultar pacientes</tspan>
    <tspan x="600" dy="28">y antecedentes</tspan>
    <tspan x="600" dy="28">clinicos.</tspan>
  </text>

  <rect class="card" x="575" y="1260" width="210" height="105" rx="4"/>
  <text class="body" x="600" y="1300">
    <tspan x="600" dy="0">Priorizar clientes</tspan>
    <tspan x="600" dy="28">y animales que</tspan>
    <tspan x="600" dy="28">requieren atencion.</tspan>
  </text>

  <!-- Deliverables -->
  <rect class="card" x="845" y="190" width="230" height="92" rx="4"/>
  <text class="body" x="870" y="230">
    <tspan x="870" dy="0">Modulo de fincas</tspan>
    <tspan x="870" dy="27">y animales.</tspan>
  </text>

  <rect class="card" x="845" y="335" width="230" height="92" rx="4"/>
  <text class="body" x="870" y="375">
    <tspan x="870" dy="0">Historial sanitario</tspan>
    <tspan x="870" dy="27">por animal.</tspan>
  </text>

  <rect class="card" x="845" y="500" width="230" height="92" rx="4"/>
  <text class="body" x="870" y="540">
    <tspan x="870" dy="0">Registro de eventos</tspan>
    <tspan x="870" dy="27">y actividades.</tspan>
  </text>

  <rect class="card" x="845" y="755" width="230" height="92" rx="4"/>
  <text class="body" x="870" y="795">
    <tspan x="870" dy="0">Modulo financiero</tspan>
    <tspan x="870" dy="27">del ganadero.</tspan>
  </text>

  <rect class="card" x="845" y="935" width="230" height="92" rx="4"/>
  <text class="body" x="870" y="975">
    <tspan x="870" dy="0">Cartera de clientes</tspan>
    <tspan x="870" dy="27">veterinarios.</tspan>
  </text>

  <rect class="card" x="845" y="1080" width="230" height="92" rx="4"/>
  <text class="body" x="870" y="1120">
    <tspan x="870" dy="0">Ficha clinica e</tspan>
    <tspan x="870" dy="27">historial del paciente.</tspan>
  </text>

  <rect class="card" x="845" y="1260" width="230" height="92" rx="4"/>
  <text class="body" x="870" y="1300">
    <tspan x="870" dy="0">Dashboard y reportes</tspan>
    <tspan x="870" dy="27">por rol.</tspan>
  </text>

  <rect class="card" x="845" y="1405" width="230" height="92" rx="4"/>
  <text class="body" x="870" y="1445">
    <tspan x="870" dy="0">Monitoreo de</tspan>
    <tspan x="870" dy="27">dispositivos IoT.</tspan>
  </text>

  <!-- User stories -->
  <rect class="card" x="1140" y="170" width="225" height="135" rx="4"/>
  <text class="id" x="1162" y="205">US-005 / US-010</text>
  <text class="small" x="1162" y="235">
    <tspan x="1162" dy="0">Como ganadero,</tspan>
    <tspan x="1162" dy="24">quiero registrar</tspan>
    <tspan x="1162" dy="24">fincas y animales</tspan>
    <tspan x="1162" dy="24">para organizar mi hato.</tspan>
  </text>

  <rect class="card" x="1140" y="335" width="225" height="135" rx="4"/>
  <text class="id" x="1162" y="370">US-014 / US-019</text>
  <text class="small" x="1162" y="400">
    <tspan x="1162" dy="0">Como usuario,</tspan>
    <tspan x="1162" dy="24">quiero consultar</tspan>
    <tspan x="1162" dy="24">historial sanitario</tspan>
    <tspan x="1162" dy="24">para tomar decisiones.</tspan>
  </text>

  <rect class="card" x="1140" y="500" width="225" height="135" rx="4"/>
  <text class="id" x="1162" y="535">US-015 / US-028</text>
  <text class="small" x="1162" y="565">
    <tspan x="1162" dy="0">Como usuario,</tspan>
    <tspan x="1162" dy="24">quiero registrar</tspan>
    <tspan x="1162" dy="24">eventos y actividades</tspan>
    <tspan x="1162" dy="24">para dar seguimiento.</tspan>
  </text>

  <rect class="card" x="1140" y="755" width="225" height="135" rx="4"/>
  <text class="id" x="1162" y="790">US-031 / US-032</text>
  <text class="small" x="1162" y="820">
    <tspan x="1162" dy="0">Como ganadero,</tspan>
    <tspan x="1162" dy="24">quiero registrar</tspan>
    <tspan x="1162" dy="24">ingresos y egresos</tspan>
    <tspan x="1162" dy="24">para controlar mi balance.</tspan>
  </text>

  <rect class="card" x="1140" y="930" width="225" height="135" rx="4"/>
  <text class="id" x="1162" y="965">US-020 / US-022</text>
  <text class="small" x="1162" y="995">
    <tspan x="1162" dy="0">Como veterinario,</tspan>
    <tspan x="1162" dy="24">quiero revisar mis</tspan>
    <tspan x="1162" dy="24">clientes para organizar</tspan>
    <tspan x="1162" dy="24">mi atencion.</tspan>
  </text>

  <rect class="card" x="1140" y="1095" width="225" height="135" rx="4"/>
  <text class="id" x="1162" y="1130">US-016 / US-026</text>
  <text class="small" x="1162" y="1160">
    <tspan x="1162" dy="0">Como veterinario,</tspan>
    <tspan x="1162" dy="24">quiero registrar</tspan>
    <tspan x="1162" dy="24">diagnosticos y revisar</tspan>
    <tspan x="1162" dy="24">historiales clinicos.</tspan>
  </text>

  <rect class="card" x="1140" y="1260" width="225" height="135" rx="4"/>
  <text class="id" x="1162" y="1295">US-035 / US-036</text>
  <text class="small" x="1162" y="1325">
    <tspan x="1162" dy="0">Como usuario,</tspan>
    <tspan x="1162" dy="24">quiero ver reportes</tspan>
    <tspan x="1162" dy="24">para priorizar</tspan>
    <tspan x="1162" dy="24">decisiones.</tspan>
  </text>

  <rect class="card" x="1140" y="1425" width="225" height="135" rx="4"/>
  <text class="id" x="1162" y="1460">US-058 / US-059</text>
  <text class="small" x="1162" y="1490">
    <tspan x="1162" dy="0">Como usuario,</tspan>
    <tspan x="1162" dy="24">quiero monitorear</tspan>
    <tspan x="1162" dy="24">dispositivos y metricas</tspan>
    <tspan x="1162" dy="24">para conocer lecturas.</tspan>
  </text>

