<text x="455.0" y="122" font-family="Arial, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#595959" text-anchor="middle">persiste</text>
<rect x="690" y="145" width="175" height="165" rx="12" fill="#E4DFEC" stroke="#A64D79" stroke-width="2" filter="url(#shadow)"/>
<text x="777.5" y="174" font-family="Arial, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#A64D79" text-anchor="middle">LOCAL</text>
<text x="777.5" y="207" font-family="Arial, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#17365D" text-anchor="middle">Sync Worker</text>
<text x="777.5" y="265" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#595959" text-anchor="middle">Detecta conexión</text>
<path d="M650,226 L684,226" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="670.0" y="122" font-family="Arial, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#595959" text-anchor="middle">entrega pendientes</text>
<rect x="905" y="145" width="175" height="165" rx="12" fill="#E2F0D9" stroke="#70AD47" stroke-width="2" filter="url(#shadow)"/>
<text x="992.5" y="174" font-family="Arial, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#70AD47" text-anchor="middle">CONTEXT</text>
<text x="992.5" y="207" font-family="Arial, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#17365D" text-anchor="middle">Contexto</text>
<text x="992.5" y="228" font-family="Arial, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#17365D" text-anchor="middle">propietario</text>
<text x="992.5" y="265" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#595959" text-anchor="middle">Valida idempotencia y</text>
<text x="992.5" y="282" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#595959" text-anchor="middle">versión</text>
<path d="M865,226 L899,226" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="885.0" y="122" font-family="Arial, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#595959" text-anchor="middle">HTTPS/JSON</text>
<rect x="1120" y="145" width="175" height="165" rx="12" fill="#FCE4D6" stroke="#F4B183" stroke-width="2" filter="url(#shadow)"/>
<text x="1207.5" y="174" font-family="Arial, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#F4B183" text-anchor="middle">EVENT</text>
<text x="1207.5" y="207" font-family="Arial, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#17365D" text-anchor="middle">Data synchronized</text>
<text x="1207.5" y="265" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#595959" text-anchor="middle">Estado Synced o</text>
<text x="1207.5" y="282" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#595959" text-anchor="middle">Conflict</text>
<path d="M1080,226 L1114,226" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1100.0" y="122" font-family="Arial, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#595959" text-anchor="middle">responde</text>
<rect x="1335" y="145" width="175" height="165" rx="12" fill="#FFF2CC" stroke="#FFD966" stroke-width="2" filter="url(#shadow)"/>
<text x="1422.5" y="174" font-family="Arial, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#FFD966" text-anchor="middle">ACTOR</text>
<text x="1422.5" y="207" font-family="Arial, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#17365D" text-anchor="middle">Usuario móvil</text>
<text x="1422.5" y="265" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#595959" text-anchor="middle">Revisa el resultado</text>
<path d="M1295,226 L1329,226" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="1315.0" y="122" font-family="Arial, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#595959" text-anchor="middle">notifica estado</text>
<rect x="45" y="350" width="1495" height="95" rx="8" fill="#FFFFFF" stroke="#BFBFBF" stroke-width="2"/>
<text x="65" y="380" font-family="Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#17365D" text-anchor="start">LECTURA DEL FLUJO</text>
<text x="65" y="408" font-family="Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1F1F1F" text-anchor="start">La sincronización es una responsabilidad de infraestructura móvil. Cada comando conserva identidad, versión y fecha; el contexto propietario decide si aplica,</text>
<text x="65" y="428" font-family="Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1F1F1F" text-anchor="start">rechaza o devuelve un conflicto para resolución.</text>
</svg>