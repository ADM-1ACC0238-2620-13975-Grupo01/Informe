<svg xmlns="http://www.w3.org/2000/svg" width="1585" height="500" viewBox="0 0 1585 500">
<title>Domain Story 5 — Sincronización y resolución de conflictos</title>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.18"/></filter>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#595959"/></marker>
</defs>
<rect width="1585" height="500" fill="#FAFAFA"/>
<text x="50" y="48" font-family="Arial, sans-serif" font-size="30" font-weight="bold" font-style="normal" fill="#17365D" text-anchor="start">Domain Story 5 — Sincronización y resolución de conflictos</text>
<text x="50" y="78" font-family="Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#595959" text-anchor="start">La sincronización es una responsabilidad de infraestructura móvil. Cada comando conserva identidad, versión y fecha; el contexto propietario decide si aplica, rechaza o devuelve un conflicto para resolución.</text>
<rect x="45" y="145" width="175" height="165" rx="12" fill="#FFF2CC" stroke="#FFD966" stroke-width="2" filter="url(#shadow)"/>
<text x="132.5" y="174" font-family="Arial, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#FFD966" text-anchor="middle">ACTOR</text>
<text x="132.5" y="207" font-family="Arial, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#17365D" text-anchor="middle">Usuario móvil</text>
<text x="132.5" y="265" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#595959" text-anchor="middle">Trabaja sin conexión</text>
<rect x="260" y="145" width="175" height="165" rx="12" fill="#DDEBF7" stroke="#5B9BD5" stroke-width="2" filter="url(#shadow)"/>
<text x="347.5" y="174" font-family="Arial, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#5B9BD5" text-anchor="middle">COMMAND</text>
<text x="347.5" y="207" font-family="Arial, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#17365D" text-anchor="middle">Guardar operación</text>
<text x="347.5" y="265" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#595959" text-anchor="middle">CommandId y versión</text>
<path d="M220,226 L254,226" fill="none" stroke="#595959" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="240.0" y="122" font-family="Arial, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#595959" text-anchor="middle">solicita</text>
<rect x="475" y="145" width="175" height="165" rx="12" fill="#E4DFEC" stroke="#A64D79" stroke-width="2" filter="url(#shadow)"/>
<text x="562.5" y="174" font-family="Arial, sans-serif" font-size="13" font-weight="bold" font-style="normal" fill="#A64D79" text-anchor="middle">LOCAL</text>
<text x="562.5" y="207" font-family="Arial, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#17365D" text-anchor="middle">Local Database</text>
<text x="562.5" y="265" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#595959" text-anchor="middle">Estado Pending</text>
