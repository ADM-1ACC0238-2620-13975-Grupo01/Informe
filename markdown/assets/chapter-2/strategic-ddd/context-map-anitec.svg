<text x="95" y="1072" font-family="Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#17365D" text-anchor="start">RELACIONES Y PATRONES</text>
<text x="95" y="1105" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#595959" text-anchor="start">1. IAM → Profiles: Customer/Supplier + Published Language (UserId, Role).</text>
<text x="95" y="1134" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#595959" text-anchor="start">2. Profiles → Livestock: Open Host Service + Published Language.</text>
<text x="95" y="1163" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#595959" text-anchor="start">3. Profiles → Veterinary Collaboration: Open Host Service + Published Language.</text>
<text x="95" y="1192" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#595959" text-anchor="start">4. IAM → Subscriptions: Open Host Service (UserId y sesión).</text>
<text x="95" y="1221" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#595959" text-anchor="start">5. Stripe ↔ Subscriptions: Anti-Corruption Layer.</text>
<text x="95" y="1250" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#595959" text-anchor="start">6. Livestock → Veterinary Collaboration: Customer/Supplier + Published Language.</text>
<text x="95" y="1279" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#595959" text-anchor="start">7. Livestock → Sanitary: Customer/Supplier + Published Language (AnimalId).</text>
<text x="95" y="1308" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#595959" text-anchor="start">8. Veterinary Collaboration → Sanitary: Customer/Supplier (autorización).</text>
<text x="905" y="1105" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#595959" text-anchor="start">9. Livestock → Activities: Published Language.</text>
<text x="905" y="1134" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#595959" text-anchor="start">10. Sanitary → Activities: Published Language (FollowUpRequired).</text>
<text x="905" y="1163" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#595959" text-anchor="start">11. Financial → Analytics: Conformist read model.</text>
<text x="905" y="1192" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#595959" text-anchor="start">12. Activities → Analytics: Conformist read model.</text>
<text x="905" y="1221" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#595959" text-anchor="start">13. Sanitary → Analytics: Conformist read model.</text>
<text x="905" y="1250" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#595959" text-anchor="start">14. Activities ↔ Notification Provider: Anti-Corruption Layer.</text>
<text x="905" y="1279" font-family="Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#595959" text-anchor="start">15. Livestock → Analytics: Conformist read model.</text>
<text x="95" y="1392" font-family="Arial, sans-serif" font-size="14" font-weight="bold" font-style="normal" fill="#17365D" text-anchor="start">Las capacidades offline, sincronización, QR y almacenamiento local pertenecen a la infraestructura móvil y no constituyen bounded contexts.</text>
</svg>