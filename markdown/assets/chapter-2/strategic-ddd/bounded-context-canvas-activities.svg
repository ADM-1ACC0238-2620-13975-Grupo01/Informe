<text x="64" y="356" font-family="Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1F1F1F" text-anchor="start">ScheduleActivity, CompleteActivity,</text>
<text x="64" y="376" font-family="Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1F1F1F" text-anchor="start">RescheduleActivity, ListPendingActivities</text>
<rect x="535" y="290" width="430" height="190" rx="4" fill="#FFFFFF" stroke="#70AD47" stroke-width="2"/>
<rect x="535" y="290" width="430" height="38" rx="4" fill="#70AD47" stroke="#70AD47" stroke-width="1"/>
