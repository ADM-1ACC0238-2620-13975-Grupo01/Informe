<text x="544" y="176" font-family="Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1F1F1F" text-anchor="start">Supporting subdomain · Custom built</text>
<rect x="1010" y="110" width="440" height="150" rx="4" fill="#FFFFFF" stroke="#17365D" stroke-width="2"/>
<rect x="1010" y="110" width="440" height="38" rx="4" fill="#17365D" stroke="#17365D" stroke-width="1"/>
<text x="1024" y="136" font-family="Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="start">DOMAIN ROLES</text>
<text x="1024" y="176" font-family="Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1F1F1F" text-anchor="start">Planning and execution context</text>
