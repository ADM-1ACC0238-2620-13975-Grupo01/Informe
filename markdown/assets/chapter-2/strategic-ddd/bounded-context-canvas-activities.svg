<text x="549" y="356" font-family="Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1F1F1F" text-anchor="start">Farm Activity, Due Date, Reminder, Activity</text>
<text x="549" y="376" font-family="Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1F1F1F" text-anchor="start">Status, Reschedule</text>
<rect x="1020" y="290" width="430" height="190" rx="4" fill="#FFFFFF" stroke="#F4B183" stroke-width="2"/>
<rect x="1020" y="290" width="430" height="38" rx="4" fill="#F4B183" stroke="#F4B183" stroke-width="1"/>
<text x="1034" y="316" font-family="Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="start">OUTBOUND COMMUNICATION</text>
<text x="1034" y="356" font-family="Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1F1F1F" text-anchor="start">ActivityScheduled, ActivityCompleted,</text>
<text x="1034" y="376" font-family="Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1F1F1F" text-anchor="start">ActivityRescheduled, ReminderDue</text>
<rect x="50" y="510" width="680" height="150" rx="4" fill="#FFFFFF" stroke="#A64D79" stroke-width="2"/>
<rect x="50" y="510" width="680" height="38" rx="4" fill="#A64D79" stroke="#A64D79" stroke-width="1"/>
<text x="64" y="536" font-family="Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="start">BUSINESS DECISIONS</text>
<text x="64" y="576" font-family="Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1F1F1F" text-anchor="start">Actividad con responsable y fecha; estados válidos; reprogramación conserva</text>
<text x="64" y="596" font-family="Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1F1F1F" text-anchor="start">trazabilidad.</text>
<rect x="770" y="510" width="680" height="150" rx="4" fill="#FFFFFF" stroke="#A64D79" stroke-width="2"/>
<rect x="770" y="510" width="680" height="38" rx="4" fill="#A64D79" stroke="#A64D79" stroke-width="1"/>
<text x="784" y="536" font-family="Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="start">DEPENDENCIES</text>
<text x="784" y="576" font-family="Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1F1F1F" text-anchor="start">Recibe referencias de Livestock y eventos de seguimiento desde Sanitary.</text>
<rect x="50" y="690" width="430" height="160" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="2"/>
<rect x="50" y="690" width="430" height="38" rx="4" fill="#595959" stroke="#595959" stroke-width="1"/>
<text x="64" y="716" font-family="Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="start">ASSUMPTIONS</text>
<text x="64" y="756" font-family="Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1F1F1F" text-anchor="start">Los usuarios autorizan notificaciones o</text>
<text x="64" y="776" font-family="Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1F1F1F" text-anchor="start">consultan su lista de pendientes.</text>
<rect x="535" y="690" width="430" height="160" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="2"/>
<rect x="535" y="690" width="430" height="38" rx="4" fill="#595959" stroke="#595959" stroke-width="1"/>
<text x="549" y="716" font-family="Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="start">VERIFICATION METRICS</text>
<text x="549" y="756" font-family="Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1F1F1F" text-anchor="start">Actividades atendidas a tiempo;</text>
<text x="549" y="776" font-family="Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1F1F1F" text-anchor="start">recordatorios entregados; reprogramaciones.</text>
<rect x="1020" y="690" width="430" height="160" rx="4" fill="#FFFFFF" stroke="#595959" stroke-width="2"/>
<rect x="1020" y="690" width="430" height="38" rx="4" fill="#595959" stroke="#595959" stroke-width="1"/>
<text x="1034" y="716" font-family="Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="start">OPEN QUESTIONS</text>
<text x="1034" y="756" font-family="Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1F1F1F" text-anchor="start">¿Se usarán notificaciones locales, push o</text>
<text x="1034" y="776" font-family="Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1F1F1F" text-anchor="start">una combinación?</text>
</svg>