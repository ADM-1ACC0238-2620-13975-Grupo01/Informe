<text x="64" y="176" font-family="Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1F1F1F" text-anchor="start">Planificar actividades, controles y</text>
<text x="64" y="196" font-family="Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1F1F1F" text-anchor="start">recordatorios y registrar su atención.</text>
